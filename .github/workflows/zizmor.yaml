name: Workflow Lint

on:
  pull_request:
    paths: ['.github/workflows/**', '.github/zizmor.yml', '.pinact.yaml']
  push:
    branches: [main]
    paths: ['.github/workflows/**', '.github/zizmor.yml', '.pinact.yaml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: zizmor
      - run: zizmor --offline .

  pinact:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bump PINACT_SHA256 with PINACT_VERSION; verify the digest out of band.
      - name: Install pinact
        env:
          PINACT_VERSION: "4.1.1"
          PINACT_SHA256: "d1cffebe5704b74e2e5f8a864efb9f7e54768972dc686188c008033fb1797841"
        run: |
          set -euo pipefail
          curl -fsSL -o pinact.tar.gz \
            "https://github.com/suzuki-shunsuke/pinact/releases/download/v${PINACT_VERSION}/pinact_linux_amd64.tar.gz"
          echo "${PINACT_SHA256}  pinact.tar.gz" | sha256sum -c -
          tar xzf pinact.tar.gz pinact
          install -m755 pinact /usr/local/bin/pinact
      - run: pinact run --check --verify-comment --verify-min-age
        env:
          GITHUB_TOKEN: ${{ github.token }}
